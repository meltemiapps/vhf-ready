# XcodeGen spec. Generate the Xcode project with:  xcodegen generate
name: VHFReady
options:
  bundleIdPrefix: com.evangelos
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""               # set your Apple Developer Team ID in Xcode
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
targets:
  VHFReady:
    type: application
    platform: iOS
    sources:
      - path: VHFReady
        excludes:
          - "Resources/Content/**"
          - "Info.plist"
      - path: VHFReady/Resources/Content
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.evangelos.vhfready
        PRODUCT_NAME: VHF Ready
        PRODUCT_MODULE_NAME: VHFReady
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: VHFReady/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: VHF Ready
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.education
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
  VHFReadyTests:
    type: bundle.unit-test
    platform: iOS
    sources: [VHFReadyTests]
    dependencies:
      - target: VHFReady
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.evangelos.vhfready.tests
schemes:
  VHFReady:
    build:
      targets:
        VHFReady: all
        VHFReadyTests: [test]
    test:
      targets: [VHFReadyTests]
